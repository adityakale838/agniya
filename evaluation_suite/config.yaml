# AGNIYA Evaluation Suite Configuration

# Test Execution Mode
mode: "full"  # Options: quick, full, custom

# Statistical Parameters
statistics:
  repetitions: 10  # Number of runs per test
  warmup_iterations: 5  # Discard to eliminate cold starts
  confidence_interval: 0.95
  outlier_threshold: 3.0  # Standard deviations

# Hardware Configuration (Auto-detected, but can override)
hardware:
  auto_detect: true
  cpu_cores: null  # null = auto-detect
  ram_gb: null
  gpu_count: null
  gpu_models: []

# Test Categories to Run
benchmarks:
  micro_benchmarks: true
  end_to_end: true
  comparative_seal: true
  rns_validation: true
  oram_evaluation: true
  gpu_acceleration: true
  batch_packing: true
  real_datasets: true
  scalability: true
  stress_chaos: true
  security_analysis: true
  ablation_study: true

# Quick Mode Settings (reduced iterations for fast validation)
quick_mode:
  repetitions: 3
  warmup_iterations: 1
  reduced_dataset_sizes: true
  skip_long_tests: true

# Micro-Benchmark Parameters
micro_benchmarks:
  key_sizes: [2048, 3072, 4096]
  batch_sizes: [1, 10, 100, 1000]
  cache_sizes:
    l1: 100
    l2: 1000
    l3: 10000

# Comparative Benchmarks
comparative:
  seal_available: true
  tenseal_available: true
  openfhe_available: true
  seal_path: null  # Path to SEAL installation

# RNS Compression Tests
rns_compression:
  key_sizes: [2048, 3072, 4096]
  prime_counts: [16, 32, 64]
  test_compression_ratio: true
  test_performance: true
  test_security: true

# ORAM Evaluation
oram:
  tree_heights: [10, 12, 15, 17, 20]
  block_sizes: [128, 256, 512]
  access_patterns:
    - "uniform_random"
    - "zipf_080_020"  # 80/20 distribution
    - "sequential"
    - "adversarial"
  modes:
    - "no_oram"
    - "full_oram"
    - "hybrid_auto"

# GPU Acceleration Tests
gpu:
  batch_sizes: [1, 10, 100, 1000, 10000]
  multi_gpu_tests: true
  gpu_counts: [1, 2, 4]
  fallback_testing: true

# Batch Packing
batch_packing:
  values_per_ciphertext: [1, 8, 16, 32, 50]
  operation_types:
    - "addition"
    - "weighted_sum"
    - "aggregation"

# Real Dataset Tests
real_datasets:
  datasets:
    insurance:
      enabled: true
      path: "data/insurance_real.csv"
      rows: 7000
      queries: ["sum_by_category", "avg_amount", "count_policies"]
    
    financial:
      enabled: true
      path: "evaluation_suite/datasets/financial_synthetic.csv"
      rows: 50000
      queries: ["fraud_detection", "daily_totals", "merchant_analytics"]
    
    healthcare:
      enabled: true
      path: "evaluation_suite/datasets/healthcare_synthetic.csv"
      rows: 100000
      queries: ["disease_prevalence", "cost_analysis", "treatment_outcomes"]
    
    iot:
      enabled: true
      path: "evaluation_suite/datasets/iot_synthetic.csv"
      rows: 1000000
      queries: ["aggregate_by_location", "time_series", "anomaly_detection"]

# Scalability Tests
scalability:
  horizontal:
    node_counts: [1, 2, 4, 8, 16]
    enabled: true  # Requires distributed setup
  
  vertical:
    cpu_cores: [4, 8, 16, 32]
    ram_gb: [8, 16, 32, 64]
    gpu_counts: [0, 1, 2, 4]

# Stress & Chaos Testing
stress:
  concurrent_clients: [10, 100, 1000]
  duration_seconds: 300
  memory_pressure_test: true
  cache_thrashing_test: true
  gpu_failure_simulation: true

# Ablation Study
ablation:
  components_to_remove:
    - "gpu"
    - "cache_l1"
    - "cache_l2"
    - "cache_l3"
    - "rns_compression"
    - "oram"
    - "jit_compilation"
    - "simd_vectorization"
    - "batch_packing"
    - "crt_decryption"
    - "precomputed_powers"

# Visualization Settings
visualization:
  output_formats: ["pdf", "svg", "png"]
  dpi: 300
  colorblind_friendly: true
  font_size: 12
  figure_size: [10, 6]  # inches
  style: "seaborn-v0_8-paper"

# Output Paths
output:
  raw_data: "evaluation_suite/results/raw_data"
  graphs: "evaluation_suite/results/graphs"
  tables: "evaluation_suite/results/tables"
  logs: "evaluation_suite/results/logs"
  summary: "evaluation_suite/results/summary_report.md"

# Reproducibility
reproducibility:
  seed: 42
  record_environment: true
  save_hardware_info: true
  save_software_versions: true
  docker_export: true

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  console: true
  file: true
  file_path: "evaluation_suite/results/logs/benchmark.log"

# Paper-Specific Settings
paper:
  target_venue: "USENIX Security"  # For formatting decisions
  page_limit: 14  # Excluding references
  generate_latex_tables: true
  generate_bibtex: true
