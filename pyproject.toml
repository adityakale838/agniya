[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "agniya"
version = "1.0.0"
description = "High-performance homomorphic encryption library with RNS compression and intelligent caching"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "AGNIYA Team", email = "agniya@example.com"}
]
keywords = ["homomorphic", "encryption", "paillier", "privacy", "cryptography", "rns", "compression"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "gmpy2>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]
server = [
    "flask>=2.0.0",
    "flask-cors>=3.0.0",
]
all = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "flask>=2.0.0",
    "flask-cors>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/adityakale838/agniya"
Documentation = "https://github.com/adityakale838/agniya#readme"
Repository = "https://github.com/adityakale838/agniya"
"Bug Tracker" = "https://github.com/adityakale838/agniya/issues"

[project.scripts]
agniya-test = "test_suite:main"

[tool.setuptools]
packages = ["agniya", "agniya.core", "agniya.compression", "agniya.storage", "agniya.hybrid", "agniya.benchmarks"]

[tool.setuptools.package-data]
agniya = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
